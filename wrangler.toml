name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "5ee0937a-58ef-407a-b94d-d0b758669032"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "0b9e564eb121442b83bdb4a8bf874994"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
